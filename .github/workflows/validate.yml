name: Validate CSC3209 search engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate deterministic corpus and reference data
        run: |
          node tools/apply_corpus_corrections.js
          python3 tools/build_universal_references.py
          python3 tools/build_past_paper_references.py

      - name: Rebuild semantic concept index
        run: npm run build:semantic

      - name: Check vector index freshness
        run: npm run check:vectors

      - name: Build browser semantic bundle
        run: npm run build:browser

      - name: Rebuild offline cache manifest
        run: npm run build:offline

      - name: Check generated deterministic assets are committed
        run: git diff --exit-code questions.json questions.js questions.tsv ALL_QUESTIONS.md topic_packs expansion/questions_advanced.json expansion/questions_advanced.js expansion/questions_code.json expansion/questions_code.js search/universal_references.js search/past_paper_references.js semantic_index.js search/local-semantic.bundle.js search/offline-manifest.js

      - name: JavaScript syntax checks
        run: |
          node --check search/hybrid-search.js
          node --check search/exam-explainer.js
          node --check search/predictor-calibration.js
          node --check search/past_paper_references.js
          node --check search/answer-predictor.js
          node --check tools/run_search_tests.js
          node --check tools/run_answer_predictor_tests.js
          node --check tools/run_why_explainer_tests.js
          node --check tools/run_hardening_tests.js
          node --check tools/run_local_semantic_tests.js
          node --check tools/run_answer_completeness_tests.js
          node --check tools/run_corpus_correctness_tests.js
          node --check tools/run_generated_question_quality_tests.js
          node --check tools/run_result_diversity_tests.js
          node --check tools/run_past_paper_benchmark.js
          node --check tools/run_offline_smoke_tests.js
          node --check tools/build_offline_manifest.js
          node --check sw.js

      - name: Answer completeness
        run: node tools/run_answer_completeness_tests.js

      - name: Corpus correctness and generator reproducibility
        run: node tools/run_corpus_correctness_tests.js

      - name: Generated question quality
        run: node tools/run_generated_question_quality_tests.js

      - name: Semantic search and ranking tests
        run: node tools/run_search_tests.js

      - name: Answer predictor tests
        run: node tools/run_answer_predictor_tests.js

      - name: Why explainer tests
        run: node tools/run_why_explainer_tests.js

      - name: Repository hardening tests
        run: node tools/run_hardening_tests.js

      - name: Result diversity and relevance floor
        run: node tools/run_result_diversity_tests.js

      - name: Local vector semantic tests
        run: node tools/run_local_semantic_tests.js

      - name: Real past-paper benchmark
        run: node tools/run_past_paper_benchmark.js

      - name: Offline preparation and upgrade smoke tests
        run: node tools/run_offline_smoke_tests.js

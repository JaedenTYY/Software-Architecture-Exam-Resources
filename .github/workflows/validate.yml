name: Validate CSC3209 search engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild generated reference data
        run: |
          python3 tools/build_universal_references.py
          python3 tools/build_past_paper_references.py

      - name: Rebuild semantic concept index
        run: npm run build:semantic

      - name: Check generated deterministic assets are committed
        run: git diff --exit-code search/universal_references.js search/past_paper_references.js semantic_index.js

      - name: Check vector index freshness
        run: npm run check:vectors

      - name: Build browser semantic bundle
        run: npm run build:browser

      - name: Check browser semantic bundle is committed
        run: git diff --exit-code search/local-semantic.bundle.js

      - name: JavaScript syntax checks
        run: |
          node --check search/hybrid-search.js
          node --check search/exam-explainer.js
          node --check search/predictor-calibration.js
          node --check search/past_paper_references.js
          node --check search/answer-predictor.js
          node --check tools/run_search_tests.js
          node --check tools/run_answer_predictor_tests.js
          node --check tools/run_why_explainer_tests.js
          node --check tools/run_hardening_tests.js
          node --check tools/run_local_semantic_tests.js

      - name: Semantic search and ranking tests
        run: node tools/run_search_tests.js

      - name: Answer predictor tests
        run: node tools/run_answer_predictor_tests.js

      - name: Why explainer tests
        run: node tools/run_why_explainer_tests.js

      - name: Repository hardening tests
        run: node tools/run_hardening_tests.js

      - name: Local vector semantic tests
        run: node tools/run_local_semantic_tests.js
